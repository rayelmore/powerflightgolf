<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triple-G Golf App</title>
<link rel="icon" type="image/png" href="img/3g-icon.png">
<link rel="apple-touch-icon" href="img/3g-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: phone-first app shell — hero, stacked cards, fixed bottom tab bar (mirrors the FPG app) */
  --bg:#f1f2ee; --surface:#ffffff; --ink:#1d2417; --muted:#6a7262; --line:#e2e5dc;
  --green:#2f5419; --green-2:#3d6b22; --gold:#e8b938; --gold-soft:#f6efd6;
  --good:#2b7a2f; --bad:#b3261e; --warn:#a86a00;
  --display:"Roboto Condensed","Arial Narrow",sans-serif;
  --body:"Roboto","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11150e; --surface:#1b2116; --ink:#e9ede4; --muted:#a3ab9a; --line:#2c3426;
    --green:#3f6e23; --green-2:#4d7f2c; --gold:#f0c64e; --gold-soft:#2c2a19;
    --good:#6cc46f; --bad:#ef7b72; --warn:#e3a43a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11150e; --surface:#1b2116; --ink:#e9ede4; --muted:#a3ab9a; --line:#2c3426;
  --green:#3f6e23; --green-2:#4d7f2c; --gold:#f0c64e; --gold-soft:#2c2a19;
  --good:#6cc46f; --bad:#ef7b72; --warn:#e3a43a; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body)}
.app{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:92px;background:var(--bg)}
a{color:var(--green-2)}
:root[data-theme="dark"] a{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) a{color:var(--gold)}}
button,input,select{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* hero */
.hero{position:relative;color:#fff;text-align:center;padding:26px 16px 26px;overflow:hidden;background:#1f3a12}
.hero svg.scene{position:absolute;inset:0;width:100%;height:100%}
.hero .inner{position:relative;display:grid;justify-items:center;gap:6px}
.logo{width:210px;max-width:62vw;border-radius:16px;overflow:hidden;border:2px solid var(--gold);box-shadow:0 8px 24px rgba(0,0,0,.45);background:#1d3a24}
.logo img{display:block;width:100%;height:auto}
.hero h1{font:800 38px/1 var(--display);color:var(--gold);margin:8px 0 0;letter-spacing:.3px;text-shadow:0 2px 8px rgba(0,0,0,.45);text-wrap:balance}
.hero .tag{font-size:17px;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.hero .welcome{font-size:20px;margin-top:6px;text-shadow:0 1px 6px rgba(0,0,0,.5)}

main{padding:18px 16px;display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.card h2,.sect{font:700 22px/1.15 var(--display);margin:0 0 12px;text-wrap:balance}
.kicker{font:700 17px var(--display);letter-spacing:1px;text-transform:uppercase}
.muted{color:var(--muted)} .small{font-size:14px}

/* next round */
.next{background:linear-gradient(135deg,var(--green),var(--green-2));color:#fff;border:0}
.next .kicker{color:#fff;opacity:.95}
.next .body{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-top:12px}
.datebox{width:96px;height:96px;border:2px solid var(--gold);border-radius:14px;background:rgba(232,185,56,.18);display:grid;place-items:center;align-content:center;color:var(--gold)}
.datebox b{font:800 40px/1 var(--display)} .datebox span{font:600 16px var(--display);color:#fff;letter-spacing:1px;margin-top:4px}
.next .course{font:800 28px/1.1 var(--display)}
.next .meta{opacity:.92}
.countdown{margin-top:16px;background:rgba(0,0,0,.18);border-radius:12px;padding:12px;text-align:center;font-size:18px}
.countdown b{color:var(--gold);font:800 26px var(--display)}
.note{margin-top:10px;font-size:14px;opacity:.9}

/* avatars */
.avatars{display:flex;flex-wrap:wrap;gap:12px}
.av{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font:800 20px var(--display);color:var(--gold);background:var(--green);border:3px solid var(--surface);box-shadow:0 1px 6px rgba(0,0,0,.18)}
.av.sm{width:42px;height:42px;font-size:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--green);color:#fff;border:0;border-radius:12px;padding:11px 18px;font-weight:700;cursor:pointer;text-decoration:none}
.btn.gold{background:var(--gold);color:#1d2417}
.btn.ghost{background:transparent;color:var(--green-2);border:1.5px solid var(--green-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* dues */
.dues{background:var(--gold-soft);border:2px solid var(--gold);display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.dues .ic{width:52px;height:52px;border-radius:50%;background:var(--gold);display:grid;place-items:center;color:#1d2417;font:800 26px var(--display)}
.dues h2{color:var(--green-2);margin:0 0 4px}
:root[data-theme="dark"] .dues h2{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .dues h2{color:var(--gold)}}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--green-2)}

/* lists */
.list{display:grid}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .name{font-weight:600}
.medal{font:800 20px var(--display);color:var(--gold);width:26px;text-align:center}
.up{color:var(--good);font-weight:700} .down{color:var(--bad);font-weight:700}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12.5px;font-weight:700;border:1px solid currentColor;white-space:nowrap}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.neutral{color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{display:grid;gap:4px;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink)}
.tile b{font:700 19px var(--display)} .tile span{color:var(--muted);font-size:14px}
.tile .ti{width:38px;height:38px;border-radius:10px;background:var(--gold-soft);display:grid;place-items:center;color:var(--green-2)}
.tile .ti svg{width:22px;height:22px}

/* tables */
.tablewrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font:700 14px var(--display);text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
th.sort{cursor:pointer}
td.num,th.num{text-align:right}
tr:last-child td{border-bottom:0}
input[type=search],input[type=text],input[type=date],input[type=number],select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
input[type=search]{width:100%}
input[type=number]{width:80px;text-align:right}
.banner{border-radius:14px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--warn)}
.banner.good{border-left-color:var(--good)}
.pagehead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pagehead h1{font:800 28px/1.1 var(--display);margin:0}

/* bottom nav */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:5}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar a{display:grid;justify-items:center;gap:2px;padding:10px 4px 12px;color:var(--muted);text-decoration:none;font-size:13px}
.tabbar a svg{width:26px;height:26px}
.tabbar a[aria-current="page"]{color:var(--green-2);font-weight:700}
:root[data-theme="dark"] .tabbar a[aria-current="page"]{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tabbar a[aria-current="page"]{color:var(--gold)}}

/* sheet */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet.open{display:flex}
.sheet .panel{background:var(--surface);width:100%;max-width:560px;max-height:85%;border-radius:20px 20px 0 0;padding:18px 16px;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);gap:12px;overflow-y:auto;overflow-x:hidden}
.cime .row input[type=text]{width:0}
.pick{overflow:auto;display:grid}
.pick label{display:flex;align-items:center;gap:12px;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.pick input{width:20px;height:20px;accent-color:var(--green-2)}

/* quick actions + leadership tools (mirrors FPG More screen) */
.qa{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qa a{display:grid;gap:4px;align-content:end;min-height:132px;padding:18px;border-radius:18px;text-decoration:none;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.qa a svg{width:34px;height:34px;color:var(--green-2);margin-bottom:auto}
.qa a b{font:700 21px/1.1 var(--display)} .qa a span{color:var(--muted);font-size:14px}
.qa a.big{background:linear-gradient(135deg,var(--green),var(--green-2));color:#fff;border:0}
.qa a.big svg{color:var(--gold)} .qa a.big span{color:#fff;opacity:.85}
.qa a.goldb{border:2px solid var(--gold)}
.qa a.goldb svg{color:var(--gold)}
.lt{display:grid}
.lt a{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.lt a:last-child{border-bottom:0}
.lt .ic{width:50px;height:50px;border-radius:14px;background:var(--green);display:grid;place-items:center;color:var(--gold)}
.lt .ic svg{width:24px;height:24px}
.lt a.gold .ic{background:var(--gold);color:#1d2417}
.lt b{font:700 19px/1.15 var(--display);display:block;color:var(--ink)} .lt span span,.lt a>span:nth-child(2){color:var(--muted);font-size:14px}
.topbar{background:linear-gradient(135deg,var(--green),var(--green-2));color:var(--gold);padding:22px 16px 18px;font:800 26px var(--display);display:flex;align-items:center;gap:12px}
.topbar img{width:40px;height:40px;border-radius:8px;border:1.5px solid var(--gold)}
.lt .chev{color:var(--muted);font-size:22px}
.livepill{display:inline-flex;align-items:center;gap:6px;background:var(--bad);color:#fff;border-radius:999px;padding:2px 10px;font:700 13px var(--display);letter-spacing:1px}
.livepill::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.livepill::before{animation:none}}
.compact th,.compact td{padding:9px 7px}
.compact th{font-size:12.5px}
.grp{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface)}
.grp h3{font:700 18px var(--display);margin:0 0 6px;display:flex;justify-content:space-between;gap:8px}
.grp .pl{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.grp select{padding:5px 6px}
.xbtn{background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer;padding:2px 6px}
.form{display:grid;gap:12px}
.form label{display:grid;gap:4px;font-weight:600;font-size:14px}
.form textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:80px}
.form input,.form select{width:100%}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat3 div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat3 b{display:block;font:800 24px var(--display)} .stat3 span{font-size:13px;color:var(--muted)}
.req{display:grid;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.req:last-child{border-bottom:0}
.req .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.req .amt{font:800 20px var(--display)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--green);color:#fff;border-color:var(--green)}
input.sm{width:64px}
.avb{background:none;border:0;padding:0;cursor:pointer;border-radius:50%}
.avb:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.whotip{position:absolute;z-index:60;background:#1d2417;color:#fff;border-radius:10px;padding:8px 12px;max-width:260px;box-shadow:0 6px 18px rgba(0,0,0,.3);display:grid;gap:2px;font-size:14px;pointer-events:none}
.whotip b{font:700 16px var(--display);color:var(--gold)} .whotip span{opacity:.9;font-size:12.5px}
.linkbtn{background:none;border:0;color:var(--green-2);text-decoration:underline;font:600 14px var(--body);padding:0;margin:-6px 0 10px;cursor:pointer}
.wholist{display:grid;gap:4px;margin:0 0 12px;padding:10px 12px;border-radius:12px;background:var(--bg);font-size:14.5px}

.dl{font-size:13.5px;padding:8px 10px;border-radius:10px;background:var(--gold-soft);margin:0 0 12px}
.dl.late{background:#fde8e6;color:#7a1d16}
.late{color:var(--bad);font-weight:700}
.mebox.off{background:var(--surface);border-color:var(--line)}
.amform{margin:8px 0 12px;border-color:var(--gold)}
.form label.chk{display:flex;gap:8px;align-items:flex-start;font-weight:500}
.form label.chk input{width:20px;height:20px;flex:none;margin-top:1px}
.datebox.sm{width:48px;height:48px;border-radius:10px;color:var(--green-2)}
.datebox.sm b{font-size:18px;line-height:1} .datebox.sm span{font-size:11px;color:var(--green-2);opacity:1;font-weight:700;text-transform:uppercase}

.val{border:2px solid var(--gold)} .val.done{border-color:var(--good)}
.vtab{font-size:14px;border-collapse:collapse}
.vtab{width:100%}
.vtab th,.vtab td{padding:3px 1px;text-align:center;border-bottom:1px solid var(--line)}
.vtab .nm{text-align:left;padding-right:4px;max-width:64px;font-size:13px;overflow:hidden;text-overflow:ellipsis}
.vtab .nm small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.vtab .parrow th{color:var(--muted);font-weight:400;font-size:12px}
.vtab .tot{font-weight:800;padding:3px 3px}
.vc{width:24px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font:700 14px var(--display);cursor:pointer;color:var(--ink);padding:0}
.fin{color:var(--good)} small.v9{display:block;font-size:10px;color:var(--good)}

.topar{font-weight:700} .topar.u{color:var(--bad)} .topar small{display:block;font-weight:400;color:var(--muted);font-size:11px}
main>*{min-width:0}
.compact.lb{font-size:14.5px}
.compact.lb th,.compact.lb td{padding:9px 4px}
.compact.lb th{font-size:11.5px;letter-spacing:.2px}
.compact.lb td:nth-child(2){max-width:96px;overflow:hidden;text-overflow:ellipsis}
.askwrap{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:50;padding:20px}
.askbox{background:var(--surface);color:var(--ink);border-radius:16px;padding:18px;max-width:380px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.askbox p{margin:0 0 14px;font-size:17px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.gchips{display:inline-flex;gap:6px;margin-left:8px;flex-wrap:wrap}
.gchip{border:1.5px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:3px 10px;font:700 12.5px var(--body);cursor:pointer;text-decoration:line-through}
.gchip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff;text-decoration:none}
.gline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%}
.mebox{flex-wrap:wrap}
.pkrow{display:flex;align-items:center;justify-content:space-between;gap:6px;border-bottom:1px solid var(--line)}
.pkrow label{border-bottom:0!important;flex:1}

.cime{display:grid;gap:8px}
.mebox{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--gold-soft);border:1px solid var(--gold)}
.av.g{background:var(--gold);color:#1d2417}

.cbar{background:#9cc58f;color:#1d2417;text-align:center;font:700 19px var(--display);padding:8px;border-radius:10px}
.steps{border:1px solid #b9d7ae;border-radius:12px;overflow:hidden;background:var(--surface)}
.st{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px}
.st.alt{background:var(--gold-soft)}
.st b{font:700 21px var(--display);color:var(--green-2)}
:root[data-theme="dark"] .st b{color:var(--gold)}
.stepper{display:flex;align-items:stretch;border:1px solid #888;border-radius:6px;overflow:hidden;flex:none}
.stepper button{width:56px;background:#2b2b2b;color:#fff;border:0;font:700 28px var(--display);cursor:pointer}
.stepper button:active{background:#000}
.stepper button:disabled{opacity:.35;cursor:not-allowed}
.stepper output{width:58px;display:grid;place-items:center;font:800 32px var(--display);background:#fff;color:#111}
.stepper output{transition:background .15s}
.s-dea{background:#1f8a3b!important;color:#fff!important}
.s-eag{background:#1f5fbf!important;color:#fff!important}
.s-bir{background:#c62828!important;color:#fff!important}
.s-bog{background:#f08c1a!important;color:#1d1d1d!important}
.s-dbl{background:#8fd0f2!important;color:#1d1d1d!important}
.legend{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-size:12.5px}
.legend span{padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.btn.big{padding:12px 40px;font-size:20px}
.pick2{display:grid}
.pick2 label{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer;font:700 19px var(--display);color:var(--green-2)}
.pick2 label.on{background:var(--gold-soft)}
.pick2 input{width:24px;height:24px;accent-color:var(--green-2)}
.skins td.wrap{white-space:normal;min-width:120px;font-size:13.5px}
.skins tr.won td{background:var(--gold-soft)}
tr.sub td{border-top:0}

.holes{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin:12px 0 8px}
.holes button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 0;font:700 14px var(--display);cursor:pointer;color:var(--ink)}
.holes button.done{background:var(--gold-soft);border-color:var(--gold)}
.holes button[aria-pressed="true"]{background:var(--green);color:#fff;border-color:var(--green)}
.holehead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 6px}
.holehead div{text-align:center} .holehead b{display:block;font:800 26px var(--display)} .holehead span{color:var(--muted);font-size:14px}
.holehead .btn{padding:8px 16px;font-size:20px}
tr.tap{cursor:pointer}
.sc{display:grid;grid-template-columns:repeat(9,1fr);gap:3px}
.sc span{display:grid;justify-items:center;font-size:12px}
.sc i{color:var(--muted);font-style:normal} .sc b{font:700 15px var(--display);width:24px;height:24px;display:grid;place-items:center;border-radius:6px}
.sc em{font-style:normal;color:var(--muted)}

.pargrid{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.pargrid label{display:grid;justify-items:center;gap:2px;font-size:12px} .pargrid i{font-style:normal;color:var(--muted)}
.pargrid input{width:100%;padding:6px 2px;text-align:center}


@media (max-width:380px){.hero h1{font-size:32px}.next .course{font-size:24px}.datebox{width:84px;height:84px}}

#fbBar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;background:#14270b;color:#fff;font-size:14px;border-bottom:2px solid var(--gold)}
#fbBar button{font:700 14px var(--display);background:var(--gold);color:#14270b;border:0;border-radius:999px;padding:7px 14px;cursor:pointer}
#fbBar.nudge{background:#7a2a14}
</style>
<script>

const $ = s => document.querySelector(s);

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const todayISO = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const D = iso => new Date(iso+'T12:00:00');

const key = n => { const w = shortName(n).toLowerCase().replace(/[^a-z ]/g,'').split(' ').filter(Boolean); return w.length ? w[0]+' '+w[w.length-1] : ''; };

function allRounds(){
  const m = {};
  SEED.rounds.forEach(r => m[r.date] = {date:r.date, course:r.course, source:'sheet'});
  Object.values(S.dbRounds).forEach(r => m[r.date] = {date:r.date, course:r.course, source:'app'});
  return Object.values(m).sort((a,b)=>a.date.localeCompare(b.date));
}
function scoresFor(p){
  const s = {...p.scores};
  Object.values(S.dbRounds).forEach(r => { if (p.id in (r.scores||{})) s[r.date] = r.scores[p.id]; else delete s[r.date]; });
  return s;
}
function quotaBefore(p, s, date){
  const seq = [...p.prior, ...Object.entries(s).filter(([d,v])=>typeof v==='number' && d<date).sort((a,b)=>a[0].localeCompare(b[0])).map(e=>e[1])];
  return seq.length>=3 ? Math.round(seq.slice(-3).reduce((a,b)=>a+b,0)/3) : null;
}
function stats(p){
  const s = scoresFor(p);
  const played = Object.entries(s).filter(([,v])=>typeof v==='number').sort((a,b)=>a[0].localeCompare(b[0]));
  const vals = played.map(x=>x[1]);
  let beat = 0, tries = 0;
  played.forEach(([d,v]) => { const q = quotaBefore(p,s,d); if (q!==null){ tries++; if (v>=q) beat++; } });
  const seq=[...p.prior,...vals];
  return { vals, played, rounds:vals.length, avg: vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : null,
    best: vals.length? Math.max(...vals) : null, beat, tries, last: played.length? played[played.length-1][0] : null,
    quota: seq.length>=3 ? Math.round(seq.slice(-3).reduce((a,b)=>a+b,0)/3) : null,
    noShows: Object.values(s).filter(v=>v==='NS').length };
}
const ROSTER = () => SEED.players.map(p => ({...p, st:stats(p)}));

function nextRound(){ const t=todayISO(); return SEED.schedule.find(r=>r.date>=t && !(r.cancelled || /cancel/i.test(r.notes||''))) || null; }
function pendingRound(){ const have=new Set(allRounds().map(r=>r.date)), t=todayISO(); return [...SEED.schedule].reverse().find(r=>r.date<t && !have.has(r.date) && !/closed|cancel/i.test(r.notes)) || null; }
function countdown(r){
  const [h,m] = teeHour(r.time); const tee = new Date(r.date+'T00:00:00'); tee.setHours(h,m,0,0);

  return hrs < 48 ? `<b>${hrs}</b> hours away` : `<b>${Math.floor(hrs/24)}</b> days, <b>${hrs%24}</b> hours away`;
}

  <radialGradient id="sun" cx=".5" cy=".55" r=".35"><stop offset="0" stop-color="#ffe6a3" stop-opacity=".95"/><stop offset="1" stop-color="#ffe6a3" stop-opacity="0"/></radialGradient></defs>
  <rect width="560" height="360" fill="url(#hsky)"/><rect width="560" height="360" fill="url(#sun)"/>
  <g fill="#1d300f" opacity=".85">
    <path d="M0 200 Q40 170 70 190 T150 185 T240 195 T330 182 T420 192 T500 180 T560 190 V230 H0z"/>
    ${[40,120,450,515].map((x,i)=>`<g transform="translate(${x} ${150+i%2*12})"><rect x="-2" y="0" width="4" height="60"/><path d="M0 0 q-28 -6 -40 10 q18 -12 40 -10 q-20 -20 -38 -14 q22 -2 38 14 q8 -26 28 -30 q-22 14 -28 30 q24 -14 40 -4 q-22 -6 -40 4z"/></g>`).join('')}
  </g>
  <path d="M0 230 Q140 205 280 222 T560 215 V360 H0z" fill="#3f6f22"/>
  <path d="M0 270 Q180 248 330 262 T560 258 V360 H0z" fill="#335d1b"/>
  <rect width="560" height="360" fill="#000" opacity=".22"/>
  </svg>`;
}
function whoName(id){ const p=PBY[id]; if (!p) return id; const g=(S.guestsIn||{})[id]; return g ? `${g.first} ${g.last}` : shortName(p.name); }
function whoSub(id){ const p=PBY[id], g=(S.guestsIn||{})[id]; const bits=[];
  if (p && nick(p.name)) bits.push(`“${nick(p.name)}”`);
  if (g) bits.push(`guest of ${PBY[g.host]?shortName(PBY[g.host].name):'?'}`); else if (p?.auto) bits.push('Regular');
  const games=[inGame(id,'skins')?'Skins':'', inGame(id,'ctp')?'CTP':''].filter(Boolean); bits.push(games.length?games.join(' + '):'No side games');
  const c=(S.checkins||{})[id]||g; if (c?.late) bits.push('late add');
  return bits.join(' · '); }
function whoAv(id){ const g=(S.guestsIn||{})[id]; const nm=whoName(id);
  return `<button class="avb" data-who="${id}" aria-label="${esc(nm)} — ${esc(whoSub(id))}" title="${esc(nm)}"><span class="av${g?' g':''}">${esc(initials(nm))}</span></button>`; }
function avatar(p, sm){ return `<span class="av${sm?' sm':''}" title="${esc(p.name)}">${esc(initials(p.name))}</span>`; }
function plusHtml(n){ return n===null ? '—' : `<span class="${n>=0?'up':'down'}">${n>=0?'+':''}${n}</span>`; }
function sortable(id, rows, cols, k0, d0='desc'){
  const s = S.sort[id] || (S.sort[id] = {key:k0, dir:d0});
  const col = cols.find(c=>c.key===s.key) || cols[0];
  rows = [...rows].sort((a,b)=>{ const x=col.val(a), y=col.val(b); if (x==null) return 1; if (y==null) return -1; const r = typeof x==='string'? x.localeCompare(y) : x-y; return s.dir==='asc'? r : -r; });
  return `<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th class="sort ${c.num?'num':''}" data-t="${id}" data-k="${c.key}" aria-sort="${c.key===s.key?(s.dir==='asc'?'ascending':'descending'):'none'}">${esc(c.label)}${c.key===s.key?(s.dir==='asc'?' ↑':' ↓'):''}</th>`).join('')}</tr></thead>
  <tbody>${rows.map(r=>'<tr>'+cols.map(c=>`<td class="${c.num?'num':''}">${c.html? c.html(r) : esc(c.val(r) ?? '—')}</td>`).join('')+'</tr>').join('')}</tbody></table></div>`;
}

function tile(href, icon, title, sub){ return `<a class="tile" href="${href}"><span class="ti">${ICON[icon]}</span><b>${title}</b><span>${sub}</span></a>`; }

function homePairings(nr){
  if (!nr) return ''; const P = S.pairings[nr.date]; if (!P || P.status!=='published' || !P.groups.length) return '';
  return `<section class="card"><div class="pagehead"><h2 style="margin:0">This Week's Pairings</h2><a href="#pairings" class="small">Details</a></div>
  ${P.groups.map((g,i)=>`<div class="li" style="grid-template-columns:82px 1fr"><b>${teeAt(P.base||nr.time,i,P.interval||8)}</b><span>${g.map(id=>esc(pname(id))).join(', ')}</span></div>`).join('')}</section>`;
}

    ${pend ? `<div class="banner"><b>Scores needed:</b> ${fmt(pend.date,{weekday:'short',month:'short',day:'numeric'})} at ${esc(pend.course)}. <a href="#scorekeeper">Enter them</a></div>`:''}
    ${nr ? `<section class="card next">
      <div class="kicker">Next Round</div>
      <div class="body"><div class="datebox"><b>${D(nr.date).getDate()}</b><span>${fmt(nr.date,{month:'short'}).toUpperCase()}</span></div>
        <div><div class="course">${esc(nr.course)}</div><div class="meta">${fmtTee(nr.time)} · ${D(nr.date).toLocaleDateString('en-US',{weekday:'long'})}</div><div class="meta">${nr.teeTimes ?? '?'} tee times</div></div></div>
      <div class="countdown">${countdown(nr)}</div>

    <section class="card">
      <div class="pagehead"><h2 style="margin:0">Who's Playing This Week</h2><span class="muted small">${playing.length+guestsToday().length} in${guestsToday().length?` · ${guestsToday().length} guest${guestsToday().length>1?'s':''}`:''}</span></div>
      <div class="avatars" style="margin:14px 0">${playing.length||guestsToday().length ? playing.map(p=>whoAv(p.id)).join('') + guestsToday().map(g=>whoAv(g.id)).join('') : `<span class="muted">${S.dbStatus==='ready'?'Nobody has checked in yet.':S.dbStatus==='connecting'?'Loading check-ins…':'Check-ins are loading from the shared scorebook.'}</span>`}</div>
      ${playing.length+guestsToday().length?`<div class="small muted" style="margin:-6px 0 12px">Skins: ${[...Object.keys(S.checkins),...Object.keys(S.guestsIn||{})].filter(id=>inGame(id,'skins')).length} · Closest to the pin: ${[...Object.keys(S.checkins),...Object.keys(S.guestsIn||{})].filter(id=>inGame(id,'ctp')).length}</div>`:''}
      ${Object.keys(S.ciOut||{}).length?`<div class="small" style="margin:-4px 0 12px"><b>Out this week:</b> ${Object.keys(S.ciOut).filter(id=>PBY[id]).map(id=>esc(sname(id))+(S.ciOut[id].late?' <span class="late">(late)</span>':'')).join(', ')}</div>`:''}
      ${(()=>{ const la=[...Object.values(S.checkins).filter(c=>c.late), ...guestsToday().filter(g=>g.late)]; return la.length?`<div class="small" style="margin:-4px 0 12px"><b>Late adds:</b> ${la.map(c=>esc(sname(c.pid||c.id))).join(', ')}</div>`:''; })()}

  R.sort((a,b)=>shortName(a.name).localeCompare(shortName(b.name)));
  const yr = new Date().getMonth() >= 9 ? 2027 : 2026;
  return `<main><div class="pagehead"><h1>Members</h1><span class="muted small">${R.length}</span></div>
  <input type="search" id="mq" value="${esc(S.mq||'')}" placeholder="Search members" aria-label="Search members">

  ${R.map(p=>{ const d=duesFor(p); const nk=nick(p.name);
    return `<div class="li">${avatar(p,true)}<div><div class="name">${esc(shortName(p.name))}${nk?` <span class="muted">“${esc(nk)}”</span>`:''}${p.guest?' <span class="pill neutral">Guest</span>':''}</div>

V.results = () => {
  const rounds = allRounds(); const d = S.resDate || rounds[rounds.length-1].date; const r = rounds.find(x=>x.date===d);
  const rows = ROSTER().map(p=>{ const s=scoresFor(p), v=s[r.date]; if (v===undefined) return null; const q = quotaBefore(p,s,r.date); return {p,v,q,plus: typeof v==='number' && q!==null ? v-q : null}; }).filter(Boolean)
    .sort((a,b)=>(b.plus??-99)-(a.plus??-99));
  return `<main><div class="pagehead"><h1>Results</h1></div>
  <select id="resDate" aria-label="Choose a round">${[...rounds].reverse().map(x=>`<option value="${x.date}"${x.date===r.date?' selected':''}>${fmt(x.date,{month:'short',day:'numeric',year:'numeric'})} · ${esc(x.course)}</option>`).join('')}</select>
  <div class="card" style="padding:4px 16px"><div class="list">
  ${rows.length ? rows.map((x,i)=>`<div class="li"><span class="medal">${typeof x.v==='number' && x.plus!==null && i<3 ? i+1 : ''}</span>
    <div><div class="name">${esc(shortName(x.p.name))}${x.p.guest?' <span class="pill neutral">Guest</span>':''}</div><div class="small muted">${x.v==='NS'?'No show':`${x.v} pts${x.q!==null?` · quota ${x.q}`:' · new player'}`}</div></div>

  const min = S.minR ?? 5;

  const cols = [
    {key:'name', label:'Player', val:p=>shortName(p.name)},
    {key:'avg', label:'Avg', num:true, val:p=>p.st.avg, html:p=>p.st.avg.toFixed(1)},
    {key:'rounds', label:'Rds', num:true, val:p=>p.st.rounds},
    {key:'best', label:'Best', num:true, val:p=>p.st.best},
    {key:'beat', label:'Beat quota', num:true, val:p=>p.st.tries? p.st.beat/p.st.tries : null, html:p=>p.st.tries? `${p.st.beat}/${p.st.tries}` : '—'},
  ];

};
V.schedule = () => {

V.scorekeeper = () => {
  const pend = pendingRound(); const d = S.skDate || (pend? pend.date : todayISO());
  const sch = SEED.schedule.find(r=>r.date===d);
  const course = S.skCourse ?? (S.dbRounds[d]?.course || sch?.course || '');
  const draft = S.skDraft || (S.skDraft = {...(S.dbRounds[d]?.scores||{})});
  const q=(S.skq||'').toLowerCase();
  const R = ROSTER().filter(p=>!p.guest || p.st.rounds).sort((a,b)=>shortName(a.name).localeCompare(shortName(b.name)));

function courseKey(name){
  const n = String(name||'').toLowerCase().replace(/[^a-z]/g,'');
  if (/heritage|hetitage/.test(n)) return /lutz/.test(n) ? 'heritageharbor' : 'heritagebradenton';
  if (/eagle/.test(n)) return 'eagleslakes';
  if (/chichi/.test(n)) return 'chichi';
  if (/clearwater/.test(n)) return 'clearwater';
  if (/cleveland/.test(n)) return 'clevelandheights';
  if (/summerfield/.test(n)) return 'summerfield';
  if (/lexington/.test(n)) return 'lexingtonoaks';
  if (/macdill/.test(n)) return 'macdill';
  for (const k of Object.keys(COURSE_SEED)) if (n.includes(k)) return k;
  return n || null;
}
function courseInfo(name){
  const k = courseKey(name); const seed = COURSE_SEED[k] || {name: name, pars:null};
  const db = S.courses[k];
  if (db && Array.isArray(db.pars) && db.pars.length===18) return {key:k, name:seed.name, pars:db.pars, src:'club', by:db.by};
  return {key:k, ...seed};
}
const PT_KEYS = [['albatross','Double eagle'],['eagle','Eagle'],['birdie','Birdie'],['par','Par'],['bogey','Bogey'],['double','Double bogey'],['worse','Triple or worse']];
// 3G scale confirmed by Ray (Nov 6, 2026): double eagle 8, eagle 6, birdie 4, par 2, bogey 1, double bogey 0 (triple or worse 0).
const PT_DEFAULT = {albatross:8, eagle:6, birdie:4, par:2, bogey:1, double:0, worse:0, confirmed:true};
function ptTable(){ const s=S.points; return s ? {...PT_DEFAULT, ...s} : {...PT_DEFAULT}; }
function holePts(gross, par){
  const T = ptTable(), d = gross - par;
  return d<=-3 ? T.albatross : d===-2 ? T.eagle : d===-1 ? T.birdie : d===0 ? T.par : d===1 ? T.bogey : d===2 ? T.double : T.worse;
}
const scls = d => d<=-3?'s-dea':d===-2?'s-eag':d===-1?'s-bir':d===0?'s-par':d===1?'s-bog':d===2?'s-dbl':'s-tri';
const parStr = n => n==null ? '—' : n===0 ? 'E' : (n>0?'+':'')+n;
const LABEL = d => d<=-3?'Dbl eagle':d===-2?'Eagle':d===-1?'Birdie':d===0?'Par':d===1?'Bogey':d===2?'Double':'Triple+';
function cardTotals(holes, pars){
  let pts=0, n=0, gross=0, toPar=0;
  Object.entries(holes||{}).forEach(([h,g])=>{ g=+g; if (g>0 && pars){ pts += holePts(g, pars[h-1]); gross+=g; toPar += g - pars[h-1]; n++; } });
  return {pts, thru:n, gross, toPar};
}
function liveRow(x, pars){ return x.holes && pars ? {...x, ...cardTotals(x.holes, pars)} : x; }

/* ---- Skins (Scrolf settings: gross score, 1 winner per hole, skin must be par or better, even split across wins, no carryover) ---- */
function skinsFor(d){
  const pars = courseInfo(schedFor(d)?.course).pars;
  const L = S.live[d] || {}, players = Object.values(L).filter(x=>x.holes && Object.keys(x.holes).length && (d!==S.ciDate || inGame(x.pid,'skins')));
  const holes = [];
  for (let h=1; h<=18; h++){
    const sc = players.filter(x=>x.holes[h]>0).map(x=>({pid:x.pid, g:+x.holes[h]}));
    if (!sc.length){ holes.push({h, low:null, win:[], ties:[], solo:[]}); continue; }
    const low = Math.min(...sc.map(s=>s.g)), at = sc.filter(s=>s.g===low).map(s=>s.pid);
    const okPar = !pars || low <= pars[h-1];
    holes.push({h, low, over: !okPar, win: at.length===1 && okPar ? at : [], ties: at.length>1?at:[], solo: at.length===1 && !okPar ? at : []});
  }
  const won = holes.filter(x=>x.win.length).length, pot = games().skins * players.length;
  const value = won ? pot/won : 0;
  const by = {}; holes.forEach(x=>x.win.forEach(p=>{ by[p]=(by[p]||0)+1; }));
  return {holes, pot, won, value, players:players.length, winners:Object.entries(by).map(([pid,n])=>({pid,n,amt:n*value})).sort((a,b)=>b.n-a.n)};
}
const money2 = n => '$'+n.toFixed(2);

/* ---- Closest to the pin ---- */
const inches = e => (+e.ft||0)*12 + (+e.inch||0);
const ftin = e => `${+e.ft||0}' ${+e.inch||0}"`;
function ctpFor(d, pars){
  const L = S.live[d] || {};
  const E = Object.values(S.ctp[d]||{}).filter(e=>(d!==S.ciDate || inGame(e.pid,'ctp')) && !(pars && L[e.pid]?.holes?.[e.hole] > pars[e.hole-1]));
  const par3 = pars ? pars.map((p,i)=>p===3?i+1:0).filter(Boolean) : [...new Set(E.map(e=>e.hole))].sort((a,b)=>a-b);
  return par3.map(h=>({h, list:E.filter(e=>e.hole===h).sort((a,b)=>inches(a)-inches(b))}));
}

function ctpMoney(d, pars){
  const C = ctpFor(d, pars), players = Object.values(S.live[d]||{}).filter(x=>x.holes && Object.keys(x.holes).length && (d!==S.ciDate || inGame(x.pid,'ctp'))).length;
  const pot = games().ctp * players, won = C.filter(c=>c.list.length).length, value = won ? pot/won : 0;
  return {C, pot, players, won, value, holes:C.length};
}
function ensureLive(d){
  if (!S.db || !d || S.liveSubs[d]) return; S.liveSubs[d] = true;
  S.db.collection(`live/${d}/players`).onSnapshot(snap=>{ const m={}; docsOf(snap).forEach(v=>{ if(v&&v.pid) m[v.pid]=v; }); S.live[d]=m; render(); }, ()=>{});
  S.db.collection(`ctp/${d}/entries`).onSnapshot(snap=>{ const m={}; docsOf(snap).forEach(v=>{ if(v&&v.pid&&v.hole) m[v.hole+'_'+v.pid]=v; }); S.ctp[d]=m; render(); }, ()=>{});
}

function contestsTable(d, pars){

async function saveLive(){
  const d=roundDate(), sch=schedFor(d), pars=courseInfo(sch?.course).pars, L=S.live[d]||{}, hole=S.lbHole||1, inR=new Set([...Object.keys(S.checkins), ...Object.keys(S.guestsIn||{})]), ids=(myGroup(d)||[]).filter(id=>inR.has(id));
  const msg=live$('scMsg'); msg.textContent='Saving…'; let n=0;
  try{
    let changedFront=false, changedBack=false;
    for (const id of ids){ const g=Math.min(S.draft.v[id], pars[hole-1]+2); const holes={...(L[id]?.holes||{})}; if (holes[hole]===g && L[id]) continue; holes[hole]=g; const t=cardTotals(holes,pars);
      const doc={...(L[id]||{}), pid:id, holes, pts:t.pts, thru:t.thru, gross:t.gross, toPar:t.toPar, at:new Date().toISOString(), by:S.meFull||''};
      if (hole<=9 && doc.v9){ delete doc.v9; changedFront=true; } if (doc.v18||doc.final){ if (hole>=10 || doc.final){ delete doc.v18; delete doc.final; changedBack=true; } }
      await S.db.doc(`live/${d}/players/${id}`).set(doc); n++; }
    const L2=S.live[d]||{}, fDone=nineDone(L2, ids, 'front'), bDone=nineDone(L2, ids, 'back');
    if (hole<18 && !(hole===9 && fDone)){ S.lbHole=hole+1; S.draft=null; }
    render();
    if ((hole===9 || changedFront) && fDone && ids.some(id=>!L2[id]?.v9)){ live$('scMsg').textContent=''; scrollTo(0,0); live$('valMsg').textContent='Front 9 complete. Check the scores against the scorecard.'; }
    else if ((hole===18 || changedBack) && bDone && ids.some(id=>!L2[id]?.final)){ live$('scMsg').textContent=''; scrollTo(0,0); live$('valMsg').textContent='All 18 holes in. Check the back 9, then save the round.'; }
    else live$('scMsg').textContent = `Hole ${hole} saved.` + (hole<18?` Now on hole ${S.lbHole}.`:'');
  }catch(e){ live$('scMsg').textContent = noWriteC; }
}

/* ---- Game Coordinator (payouts & winners) ---- */
const SPLITS = {1:[100],2:[60,40],3:[50,30,20],4:[40,30,20,10],5:[35,25,20,12,8]};
const autoPlaces = n => n<=6?2 : n<=12?3 : n<=20?4 : 5;
function payoutCalc(d, buyin, places){
  const R = SEED.players.map(p=>{ const s=scoresFor(p), v=s[d]; if (typeof v!=='number') return null; const q=quotaBefore(p,s,d); return {pid:p.id, v, q, plus:q===null?null:v-q}; }).filter(Boolean);
  const field = R.filter(x=>x.plus!==null).sort((a,b)=>b.plus-a.plus);
  const pot = buyin * R.length, split = SPLITS[places] || SPLITS[3];
  const winners = []; let i=0;
  while (i<field.length && i<split.length){
    const tied = field.filter(x=>x.plus===field[i].plus);
    const share = split.slice(i, i+tied.length).reduce((a,b)=>a+b,0);
    const each = Math.floor(pot*share/100/tied.length);
    tied.forEach(t=>winners.push({pid:t.pid, name:pname(t.pid), pts:t.v, plus:t.plus, place:i+1, tie:tied.length>1, amt:each}));
    i += tied.length;
  }
  return {entrants:R.length, newPlayers:R.length-field.length, pot, winners, paid:winners.reduce((a,w)=>a+w.amt,0)};
}

  const P0=S.pairings[d]; if (!S.pt || S.pt.date!==d || (!S.pt.dirty && P0 && P0.savedAt!==S.pt.from)){ const P=P0; S.pt = {date:d, groups: P ? P.groups.map(g=>[...g]) : [], interval: P?.interval || 8, dirty:false, from:P?.savedAt}; }
  return S.pt;
}
function makeGroups(ids, mode){
  const n = ids.length, g = Math.max(1, Math.ceil(n/4));
  let list = [...ids];
  if (mode==='random'){ for (let i=list.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [list[i],list[j]]=[list[j],list[i]]; } }
  else { const qs = list.map(curQuota).filter(q=>q!==null).sort((a,b)=>a-b); const med = qs.length?qs[Math.floor(qs.length/2)]:0; list.sort((a,b)=>(curQuota(b)??med)-(curQuota(a)??med)); }
  const G = Array.from({length:g},()=>[]);
  list.forEach((id,i)=>{ const row=Math.floor(i/g), col=i%g; G[mode==='random'||row%2===0?col:g-1-col].push(id); });
  return G;
}

const BASE_SCHED = SEED.schedule.map(r=>({...r}));
const composeName = (f,n,l) => n ? `${f} (${n}) ${l}`.trim() : `${f} ${l}`.trim();
function splitName(n){ const w=shortName(n).split(' '); return {first:w[0]||'', last:w.slice(1).join(' '), nick:nick(n)}; }
function rebuildSNAME(){
  const base = p => { const nk = nick(p.name); return nk ? nk.replace(/["“”]/g,'') : shortName(p.name).split(' ')[0]; };
  const list = SEED.players.filter(p=>!(S.guestBook||{})[p.id]); const count={};
  list.forEach(p=>{ const b=base(p); count[b]=(count[b]||0)+1; });
  list.forEach(p=>{ const b=base(p); const w=shortName(p.name).split(' '); SNAME[p.id] = count[b]>1 ? `${b} ${w[w.length-1][0]}.` : b; });
}
function applyRoster(){
  Object.values(S.roster||{}).forEach(o=>{
    if (!o || !o.id) return;
    let p = PBY[o.id];
    if (!p){ p = {id:o.id, scores:{}, prior:[]}; SEED.players.push(p); PBY[o.id]=p; }
    p.name = composeName(o.first, o.nick, o.last);
    p.display = composeName(o.first, o.nick, (o.last||'')[0]||'');
    p.guest = o.member === false; p.inactive = !!o.inactive; p.phone = o.phone||''; p.email = o.email||''; if (o.auto !== undefined) p.auto = !!o.auto;
  });
  rebuildSNAME(); computeCheckins();
}
const fromHrs = s => { const [h,m]=teeHour(s||''); return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`; };
const toHrs = v => v ? v.replace(':','')+'hrs' : '';
const isCancelled = r => r.cancelled || /cancel/i.test(r.notes||'');
function applySched(){
  const m = new Map(BASE_SCHED.map(r=>[r.date, {...r}]));
  Object.values(S.sched||{}).forEach(o=>{ if (!o || !o.date) return; if (o.deleted) m.delete(o.date); else m.set(o.date, {date:o.date, course:o.course, time:o.time, teeTimes:o.teeTimes, notes:o.notes||'', cancelled:!!o.cancelled}); });
  SEED.schedule = [...m.values()].sort((a,b)=>a.date.localeCompare(b.date));
  const nr = nextRound(), want = nr ? nr.date : todayISO();
  if (S.db && want !== S.ciDate) subRound(want);
}
function knownCourses(){ return [...new Set([...Object.values(COURSE_SEED).map(c=>c.name), ...SEED.schedule.map(r=>r.course)].filter(Boolean))].sort(); }

(async()=>{

      ()=>{ clearTimeout(timer); S.dbStatus='off'; render(); });
    ensureLive(S.ciDate);
    db.collection('pairings').onSnapshot(snap=>{ const m={}; docsOf(snap).forEach(v=>{ if(v&&v.date) m[v.date]=v; }); S.pairings=m; render(); }, ()=>{});
    db.collection('courses').onSnapshot(snap=>{ const m={}; docsOf(snap).forEach(v=>{ if(v&&v._id) m[v._id]=v; else if (v&&v.key) m[v.key]=v; }); S.courses=m; render(); }, ()=>{});
    db.collection('settings').onSnapshot(snap=>{ docsOf(snap).forEach(v=>{ if (v && (v._id==='points' || v.kind==='points')) S.points=v; if (v && (v._id==='games' || v.kind==='games')) S.games=v; }); render(); }, ()=>{});
    db.collection('payouts').onSnapshot(snap=>{ const m={}; docsOf(snap).forEach(v=>{ if(v&&v.date) m[v.date]=v; }); S.payouts=m; render(); }, ()=>{});
    db.collection('requests').onSnapshot(snap=>{ const m={}; docsOf(snap).forEach(v=>{ const id=v&&(v.id||v._id); if(id&&v.at){ v._id=id; m[id]=v; } }); S.requests=m; render(); }, ()=>{});
    db.collection('approvals').onSnapshot(snap=>{ const m={}; docsOf(snap).forEach(v=>{ const id=v&&(v.rid||v._id); if(id) m[id]=v; }); S.approvals=m; render(); }, ()=>{});
    db.collection('guests').onSnapshot(snap=>{ const m={}; docsOf(snap).forEach(v=>{ if(v&&v.id){ m[v.id]=v; registerGuest(v); } }); S.guestBook=m; render(); if ($('#sheet').classList.contains('open')) drawPick(); }, ()=>{});
    db.collection('roster').onSnapshot(snap=>{ const m={}; docsOf(snap).forEach(v=>{ if(v&&v.id) m[v.id]=v; }); S.roster=m; applyRoster(); render(); if ($('#sheet').classList.contains('open')) drawPick(); }, ()=>{});
    db.collection('sched').onSnapshot(snap=>{ const m={}; docsOf(snap).forEach(v=>{ if(v&&v.date) m[v.date]=v; }); S.sched=m; applySched(); render(); }, ()=>{});
    subRound(S.ciDate);
    if (false) db.collection(`checkins/${S.ciDate}/guests`).onSnapshot(snap=>{ const m={}; docsOf(snap).forEach(v=>{ if(v&&v.id){ m[v.id]=v; registerGuest(v); } }); S.guestsIn=m; render(); if ($('#sheet').classList.contains('open')) drawPick(); }, ()=>{});
    if (false) db.collection(`checkins/${S.ciDate}/players`).onSnapshot(snap=>{ const m={}; docs(snap).forEach(v=>{ if(v&&v.pid) m[v.pid]=v; }); S.checkins=m; render(); if ($('#sheet').classList.contains('open')) drawPick(); }, ()=>{});
  }catch(e){ clearTimeout(timer); S.dbStatus='off'; render(); }
})();
</script>
</body>
</html>
